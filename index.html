<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e14">
<title>Récré</title>
<meta name="description" content="Défiez vos amis sur une poignée de petits jeux et comparez vos records.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0e14'/%3E%3Cpath d='M17 4 8 18h6l-1 10 11-16h-7z' fill='%23ff5d5d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<div id="app">

  <header class="topbar">
    <button class="brand" id="btn-home" type="button" aria-label="Retour à l'accueil">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M17 4 8 18h6l-1 10 11-16h-7z"/></svg>
      </span>
      <span class="brand-name">Récré</span>
    </button>

    <button class="player-chip" id="btn-player" type="button">
      <span class="player-dot" id="player-dot" aria-hidden="true"></span>
      <span id="player-label">…</span>
    </button>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-tab="hub" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 12 12 4l8 8M6 10v9h5v-6h2v6h5v-9"/></svg>
      <span>Jeux</span>
    </button>
    <button class="tab" data-tab="ranks" type="button">
      <svg viewBox="0 0 24 24"><path d="M8 20V10M14 20V4M20 20v-7M4 20h16"/></svg>
      <span>Classements</span>
    </button>
    <button class="tab" data-tab="comments" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-4 4V5z"/></svg>
      <span>Avis</span>
    </button>
  </nav>

</div>

<template id="tpl-toast"><div class="toast"></div></template>

<script type="module" src="app.js"></script>
</body>
</html>
